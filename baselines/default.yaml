# 系统关键文件基线检查配置
# ================================================
# 使用步骤:
#   1. 在目标系统上运行以下命令获取真实哈希值:
#      sha256sum /etc/passwd /etc/shadow /etc/sudoers /etc/ssh/sshd_config /etc/hosts
#
#   2. 将输出中的哈希值替换到下面对应的 PLACEHOLDER_* 位置
#
#   3. 运行检查:
#      ./baseline-guard check -c baselines/system_critical.yaml
#
# 字段说明:
#   type:        检查类型列表 [file_permission, file_hash]
#   path:        目标文件路径
#   expected:    期望权限 (八进制字符串)
#   hash:        期望文件内容的 sha256 哈希值
#   on_failure:  失败处理方式 (report_only / alert / block)
# ================================================

# 待替换的占位符:
#   PLACEHOLDER_PASSWD_HASH      -> /etc/passwd 的 sha256 值
#   PLACEHOLDER_SHADOW_HASH      -> /etc/shadow 的 sha256 值
#   PLACEHOLDER_SUDOERS_HASH     -> /etc/sudoers 的 sha256 值
#   PLACEHOLDER_SSHD_CONFIG_HASH -> /etc/ssh/sshd_config 的 sha256 值
#   PLACEHOLDER_HOSTS_HASH       -> /etc/hosts 的 sha256 值

rules:
  # ========== /etc/passwd ==========
  - id: "SYS-PASSWD-001"
    name: "系统用户文件权限与完整性检查 - /etc/passwd"
    severity: "critical"
    check:
      type:
        - "file_permission"
        - "file_hash"
      path: "/etc/passwd"
      expected: "0644"
      hash: "sha256:PLACEHOLDER_PASSWD_HASH"
      on_failure: "report_only"

  # ========== /etc/shadow ==========
  - id: "SYS-SHADOW-001"
    name: "系统密码文件权限与完整性检查 - /etc/shadow"
    severity: "critical"
    check:
      type:
        - "file_permission"
        - "file_hash"
      path: "/etc/shadow"
      expected: "0640"
      hash: "sha256:PLACEHOLDER_SHADOW_HASH"
      on_failure: "report_only"

  # ========== /etc/sudoers ==========
  - id: "SYS-SUDOERS-001"
    name: "sudo授权文件权限与完整性检查 - /etc/sudoers"
    severity: "critical"
    check:
      type:
        - "file_permission"
        - "file_hash"
      path: "/etc/sudoers"
      expected: "0440"
      hash: "sha256:PLACEHOLDER_SUDOERS_HASH"
      on_failure: "report_only"

  # ========== /etc/ssh/sshd_config ==========
  - id: "SYS-SSHD-001"
    name: "SSH服务配置文件权限与完整性检查 - /etc/ssh/sshd_config"
    severity: "high"
    check:
      type:
        - "file_permission"
        - "file_hash"
      path: "/etc/ssh/sshd_config"
      expected: "0644"
      hash: "sha256:PLACEHOLDER_SSHD_CONFIG_HASH"
      on_failure: "report_only"

  # ========== /etc/hosts ==========
  - id: "SYS-HOSTS-001"
    name: "主机解析文件权限与完整性检查 - /etc/hosts"
    severity: "high"
    check:
      type:
        - "file_permission"
        - "file_hash"
      path: "/etc/hosts"
      expected: "0644"
      hash: "sha256:PLACEHOLDER_HOSTS_HASH"
      on_failure: "report_only"

# ================================================
# 扩展模板 - 按需添加更多关键文件
# ================================================
# 常用系统关键文件参考:
#   /etc/group         - 用户组信息         (标准权限: 644)
#   /etc/gshadow       - 组密码哈希         (标准权限: 640)
#   /etc/pam.d/system-auth - PAM认证配置    (标准权限: 644)
#   /etc/crontab       - 系统定时任务        (标准权限: 644)
#   /etc/fstab         - 文件系统挂载表      (标准权限: 644)
#   /etc/resolv.conf   - DNS解析配置         (标准权限: 644)
#   /etc/ntp.conf      - NTP时间同步配置     (标准权限: 644)
#   /etc/sysctl.conf   - 内核参数配置        (标准权限: 644)
#
# 模板格式:
#   - id: "SYS-XXX-001"
#     name: "描述"
#     severity: "critical"     # low / medium / high / critical
#     check:
#       type:
#         - "file_permission"
#         - "file_hash"
#       path: "/etc/xxx"
#       expected: "0644"
#       hash: "sha256:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#       on_failure: "report_only"
# ================================================

