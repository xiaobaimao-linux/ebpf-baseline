# 攻击用例库专用 monitor 配置（tests/attack-cases/）
# 用法: sudo ./baseline-guard monitor --db baseline.db -c tests/attack-cases/config.yaml
# 与仓库根 config.yaml 的差异：补充了用例需要的监控路径；throttle 调小，保证用例连跑 2 遍时每遍都能落库。

telemetry:
  network: true
  dns: true
  privilege: true
  store: true
  events_db: "events.db"
  batch_size: 500
  batch_ms: 200

rules:
  - id: "AC-02"
    name: "监控敏感文件读取 - /etc/shadow"
    severity: "critical"
    monitor:
      path: "/etc/shadow"
      events: ["read", "write", "delete", "chmod"]
      action: "alert"

  - id: "AC-05A"
    name: "监控敏感文件读取 - /etc/gshadow"
    severity: "critical"
    monitor:
      path: "/etc/gshadow"
      events: ["read", "write", "delete", "chmod"]
      action: "alert"

  - id: "AC-05B"
    name: "监控敏感文件读取 - /root/.ssh/id_rsa"
    severity: "critical"
    monitor:
      path: "/root/.ssh/id_rsa"
      events: ["read", "write", "delete", "chmod"]
      action: "alert"

  - id: "AC-03"
    name: "监控 chmod 777 敏感文件 - chmod-target.conf"
    severity: "medium"
    monitor:
      path: "/tmp/bg-attack-cases/chmod-target.conf"
      events: ["write", "delete", "chmod"]
      action: "alert"

  - id: "AC-06"
    name: "监控受保护基线文件 - protected-baseline.conf"
    severity: "high"
    monitor:
      path: "/tmp/bg-attack-cases/protected-baseline.conf"
      events: ["write", "delete", "chmod"]
      action: "alert"

  # W6 D1 凭据类规则用例：file 事件仅覆盖注册的 inode，DSL 规则内路径必须先在此注册
  - id: "AC-12"
    name: "监控 /etc/passwd 写入 - cred-write-passwd 用例"
    severity: "high"
    monitor:
      path: "/etc/passwd"
      events: ["write", "delete", "chmod"]
      action: "alert"

  - id: "AC-12B"
    name: "监控 passwd 测试替身 - passwd-copy"
    severity: "high"
    monitor:
      path: "/tmp/bg-attack-cases/passwd-copy"
      events: ["write", "delete", "chmod"]
      action: "alert"

  - id: "AC-13"
    name: "监控 authorized_keys 测试文件"
    severity: "high"
    monitor:
      path: "/tmp/bg-attack-cases/fakehome/.ssh/authorized_keys"
      events: ["write", "delete", "chmod"]
      action: "alert"

  - id: "AC-14"
    name: "监控 bash_history 测试文件"
    severity: "medium"
    monitor:
      path: "/tmp/bg-attack-cases/fakehome/.bash_history"
      events: ["write", "delete"]
      action: "alert"

alert:
  dingtalk:
    webhook: ""
    secret: ""
  throttle: 10

db:
  retention_days: 30

# W6 D1：rules_dir 上移到 rules/（递归加载），core 新规则与 examples 示例同时生效
rule_engine:
  enabled: true
  rules_dir: "rules"
